<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochregallager Steuerung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e5e7eb;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(2, 6, 23, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 8px;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 0.9em;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .motor-card {
            background: linear-gradient(145deg, #020617 0%, #0f172a 100%);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.1);
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .motor-card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.3);
        }
        
        .motor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
        }
        
        .motor-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #38bdf8;
        }
        
        .axis-label {
            background: rgba(56, 189, 248, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            color: #38bdf8;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.9em;
            color: #cbd5e1;
            font-weight: 500;
        }
        
        .slider-container {
            position: relative;
            padding: 10px 0;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #ef4444 0%, #fbbf24 50%, #22c55e 100%);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            transition: all 0.2s;
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }
        
        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            transition: all 0.2s;
        }
        
        .slider::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }
        
        .value-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.85em;
            color: #94a3b8;
        }
        
        .current-value {
            font-weight: bold;
            color: #38bdf8;
            font-size: 1.1em;
        }
        
        .action-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: #020617;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
        }
        
        .action-button:active {
            transform: translateY(0);
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }
        
        .action-button.active {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 6px 25px rgba(34, 197, 94, 0.5);
        }
        
        .sensors-section {
            background: linear-gradient(145deg, #020617 0%, #0f172a 100%);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        
        .sensors-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
        }
        
        .sensors-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        
        .sensors-subtitle {
            color: #94a3b8;
            font-size: 0.85em;
        }
        
        .sensors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        
        .sensor {
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            background: #1e293b;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .sensor-label {
            font-size: 0.75em;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .sensor-value {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .sensor.active {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #022c22;
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        
        .sensor.active .sensor-label {
            color: #022c22;
        }
        
        .sensor.inactive {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #450a0a;
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }
        
        .sensor.inactive .sensor-label {
            color: #450a0a;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.connected {
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @media (max-width: 768px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .sensors-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏭 Hochregallager Steuerung</h1>
            <p class="subtitle">Beta-Modus • Manuelle Motorsteuerung <span class="status-indicator connected"></span></p>
        </header>
        
        <div class="controls-grid">
            <!-- X-Achse Motor -->
            <div class="motor-card">
                <div class="motor-header">
                    <h2 class="motor-title">Motor X-Achse</h2>
                    <span class="axis-label">Horizontal</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Geschwindigkeit</label>
                    <div class="slider-container">
                        <input type="range" id="speedX" class="slider" min="-100" max="100" value="0">
                        <div class="value-display">
                            <span>◄ Rückwärts</span>
                            <span class="current-value" id="speedXValue">0%</span>
                            <span>Vorwärts ►</span>
                        </div>
                    </div>
                </div>
                
                <button class="action-button" id="actionX" onclick="Clicked('X')">
                    Motor X Aktivieren
                </button>
            </div>
            
            <!-- Y-Achse Motor -->
            <div class="motor-card">
                <div class="motor-header">
                    <h2 class="motor-title">Motor Y-Achse</h2>
                    <span class="axis-label">Vertikal</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Geschwindigkeit</label>
                    <div class="slider-container">
                        <input type="range" id="speedY" class="slider" min="-100" max="100" value="0">
                        <div class="value-display">
                            <span>◄ Abwärts</span>
                            <span class="current-value" id="speedYValue">0%</span>
                            <span>Aufwärts ►</span>
                        </div>
                    </div>
                </div>
                 
                <button class="action-button" id="actionY" onclick="Clicked('Y')" >
                    Motor Y Aktivieren
                </button>
            </div>
        </div>
        
        <!-- Sensoren -->
        <div class="sensors-section">
            <div class="sensors-header">
                <h2 class="sensors-title">📡 Sensor Status</h2>
                <p class="sensors-subtitle">Heberposition & Systemstatus</p>
            </div>
            <div class="sensors-grid" id="sensorsGrid">
                <!-- Sensoren werden dynamisch geladen -->
            </div>
        </div>
    </div>
    
    <script>
        // Geschwindigkeitsanzeige aktualisieren
        const speedXSlider = document.getElementById('speedX');
        const speedYSlider = document.getElementById('speedY');
        const speedXValue = document.getElementById('speedXValue');
        const speedYValue = document.getElementById('speedYValue');
        
        speedXSlider.addEventListener('input', function() {
            speedXValue.textContent = this.value + '%';
        });
        
        speedYSlider.addEventListener('input', function() {
            speedYValue.textContent = this.value + '%';
        });
        
        let isClicked = { X: false, Y: false };

        function Clicked(axis) {
            console.log("Button " + axis + " clicked");
            isClicked[axis] = !isClicked[axis];
            if(isClicked[axis]) {
                activateMotor(axis);
            }
            else {
                deactivateMotor(axis);
            }
        }

        // Motor-Aktivierung
        let motorStates = { X: false, Y: false };
        
        function activateMotor(axis) {
            motorStates[axis] = true;
            const button = document.getElementById('action' + axis);
            button.classList.add('active');
            button.textContent = 'Motor ' + axis + ' Aktiv ●';
            
            const speed = document.getElementById('speed' + axis).value;
            
            fetch('/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    axis: axis,
                    speed: parseInt(speed),
                    active: true
                })
            });
        }
        
        function deactivateMotor(axis) {
            motorStates[axis] = false;
            const button = document.getElementById('action' + axis);
            button.classList.remove('active');
            button.textContent = 'Motor ' + axis + ' Aktivieren';
            
            fetch('/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    axis: axis,
                    speed: 0,
                    active: false
                })
            });
        }
        
        // Sensoren aktualisieren
        function updateSensors() {
            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    const grid = document.getElementById('sensorsGrid');
                    
                    // Grid nur neu aufbauen wenn sich Anzahl ändert
                    if (grid.children.length !== data.length) {
                        grid.innerHTML = '';
                        data.forEach((value, i) => {
                            const sensor = document.createElement('div');
                            sensor.id = 'sensor' + i;
                            sensor.className = 'sensor';
                            sensor.innerHTML = `
                                <div class="sensor-label">Sensor ${i + 1}</div>
                                <div class="sensor-value">?</div>
                            `;
                            grid.appendChild(sensor);
                        });
                    }
                    
                    // Werte aktualisieren
                    data.forEach((value, i) => {
                        const sensor = document.getElementById('sensor' + i);
                        const valueEl = sensor.querySelector('.sensor-value');
                        valueEl.textContent = value ? 'AN' : 'AUS';
                        sensor.className = 'sensor ' + (value ? 'active' : 'inactive');
                    });
                })
                .catch(err => console.error('Fehler beim Laden der Sensordaten:', err));
        }
        
        // Periodische Updates
        setInterval(updateSensors, 1000);
        updateSensors();
    </script>
</body>
</html>
