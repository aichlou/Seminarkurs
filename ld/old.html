<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Python Webserver</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #020617;
            padding: 24px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #020617;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .indicator {
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            background: #1e293b;
        }

        .on {
            background: #22c55e;
            color: #022c22;
        }

        .off {
            background: #ef4444;
            color: #450a0a;
        }
    </style>
</head>
<body>
<div class="card">
    <button onclick="sendAction()">POST-Action</button>

    <div class="status">
        <div id="s0" class="indicator">?</div>
        <div id="s1" class="indicator">?</div>
        <div id="s2" class="indicator">?</div>
        <div id="s3" class="indicator">?</div>
    </div>
</div>

<script>
function sendAction() {
    fetch("/action", { method: "POST" });
}

function updateStatus() {
    fetch("/status")
        .then(r => r.json())
        .then(data => {
            data.forEach((value, i) => {
                const el = document.getElementById("s" + i);
                el.textContent = value ? "AN" : "AUS";
                el.className = "indicator " + (value ? "on" : "off");
            });
        });
}

setInterval(updateStatus, 1000);
updateStatus();
</script>
</body>
</html>
